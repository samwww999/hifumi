<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UA特殊賽牌組分數圖表產出器</title>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    :root {
      --bg-page: #1e2024;
      --bg-panel: #2b2e34;
      --bg-board: #e2e4e8;
      --tier-text: #2c2818;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .toolbar {
      width: 100%;
      max-width: 1120px;
      background: var(--bg-panel);
      padding: 16px 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }

    .toolbar-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    /* 模式勾選方塊 */
    .mode-checks {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .mode-check {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #1f2227;
      border: 1.5px solid #3f444e;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .mode-check:hover {
      border-color: #60a5fa;
    }

    .mode-check input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #3b82f6;
      cursor: pointer;
    }

    .mode-check.active-star {
      border-color: #f59e0b;
      background: rgba(245, 158, 11, 0.14);
      color: #fde68a;
    }

    .mode-check.active-heart {
      border-color: #ec4899;
      background: rgba(236, 72, 153, 0.14);
      color: #fbcfe8;
    }

    .btn {
      padding: 9px 15px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-success {
      background: #10b981;
      color: #fff;
    }
    .btn-success:hover {
      background: #059669;
    }

    .btn-secondary {
      background: #3f444e;
      color: #e5e7eb;
    }
    .btn-secondary:hover {
      background: #4b515d;
    }

    .stats {
      font-size: 13px;
      color: var(--text-muted);
      margin-left: 4px;
    }
    .stats strong {
      color: #60a5fa;
      font-size: 15px;
    }

    .board-wrapper {
      width: 100%;
      max-width: 1120px;
      overflow-x: auto;
    }

    #tier-board {
      display: flex;
      flex-direction: column;
      width: 1080px;
      background-color: #c8cdd5;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
      gap: 3px;
    }

    .tier-row {
      display: flex;
      min-height: 112px;
      background-color: var(--bg-board);
    }

    .tier-sidebar {
      width: 115px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 8px;
      border-right: 2px solid rgba(0, 0, 0, 0.08);
    }

    .tier-title {
      font-size: 26px;
      font-weight: 800;
      color: var(--tier-text);
      text-align: center;
      line-height: 1.2;
      letter-spacing: 1px;
    }

    .tier-grid {
      flex: 1;
      padding: 12px 14px;
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 10px;
      align-content: start;
    }

    .icon-card {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      background: #cfd4dc;
      border: 2.5px solid #b8bec8;
      transition: transform 0.14s ease, filter 0.18s ease, opacity 0.18s ease, box-shadow 0.14s ease;
      user-select: none;
    }

    .icon-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    /* 未點選狀態：彩度降低為 30% */
    .icon-card:not(.active) {
      filter: saturate(30%);
      opacity: 0.85;
      border-color: #c5cad3;
    }

    .icon-card:not(.active):hover {
      filter: saturate(55%);
      opacity: 0.95;
      transform: scale(1.03);
    }

    /* 點選作用狀態：100% 彩度 */
    .icon-card.active {
      filter: saturate(100%);
      opacity: 1;
      border-color: #ffffff;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.28);
      transform: scale(1.02);
    }

    .icon-card.active:hover {
      transform: scale(1.05);
    }

    /* 角落 Mark（左上星星：擅長牌組 / 右上愛心：喜歡牌組） */
    .card-mark {
      position: absolute;
      top: 4px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      line-height: 1;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.45);
      pointer-events: none;
      z-index: 2;
    }

    .mark-star {
      left: 4px;
      background: rgba(245, 158, 11, 0.95);
      color: #fffbeb;
      border: 1.5px solid #ffffff;
    }

    .mark-heart {
      right: 4px;
      background: rgba(236, 72, 153, 0.95);
      color: #fdf2f8;
      border: 1.5px solid #ffffff;
    }

    .icon-card.has-star .mark-star {
      display: flex;
    }

    .icon-card.has-heart .mark-heart {
      display: flex;
    }

    .empty-row-hint {
      grid-column: 1 / -1;
      height: 84px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #7b8290;
      font-size: 13px;
      border: 1.5px dashed #c2c7d0;
      border-radius: 8px;
    }

    .exporting .empty-row-hint,
    .exporting .icon-card:not(.active),
    .exporting .tier-row.no-active-export {
      display: none !important;
    }

    .exporting .tier-row {
      min-height: 92px;
    }

    .footer-note {
      margin-top: 14px;
      font-size: 13px;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.6;
    }

    .site-disclaimer {
      width: 100%;
      max-width: 1120px;
      margin-top: 16px;
      padding: 14px 18px;
      background: var(--bg-panel);
      border-radius: 10px;
      font-size: 13px;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.6;
    }

    .site-disclaimer a {
      color: #60a5fa;
      text-decoration: underline;
      word-break: break-all;
    }

    .site-disclaimer a:hover {
      color: #93c5fd;
    }
  </style>
</head>
<body>

  <div class="toolbar">
    <div class="toolbar-group">
      <span class="stats">已選取：<strong id="selected-count">0</strong> / <span id="total-count">0</span></span>

      <div class="mode-checks">
        <label class="mode-check" id="label-mode-star" title="勾選後點擊牌組，在左上角加上星星 mark（擅長牌組）">
          <input type="checkbox" id="mode-star" />
          <span>★ 擅長牌組</span>
        </label>
        <label class="mode-check" id="label-mode-heart" title="勾選後點擊牌組，在右上角加上愛心 mark（喜歡牌組）">
          <input type="checkbox" id="mode-heart" />
          <span>♥ 喜歡牌組</span>
        </label>
      </div>
    </div>

    <div class="toolbar-group">
      <button class="btn btn-secondary" onclick="selectAll(true)">全選</button>
      <button class="btn btn-secondary" onclick="selectAll(false)">取消全選</button>
      <button class="btn btn-secondary" onclick="clearAllMarks()">清除所有標記</button>
      <button class="btn btn-success" onclick="exportAsImage()">💾 匯出已選取圖片</button>
    </div>
  </div>

  <div class="board-wrapper">
    <div id="tier-board"></div>
  </div>

  <div class="footer-note">
    未勾選「擅長牌組 / 喜歡牌組」時，點擊 ICON 切換「100% 彩度（選取）/ 30% 彩度（未選取）」；勾選其中一項時，點擊 ICON 可切換左上星星（擅長）或右上愛心（喜歡）標記。
  </div>

  <footer class="site-disclaimer">
    此卡表參考水鬼團特殊賽分數表製作（<a href="https://mizuoni.blogspot.com/p/union-arena-tier-list.html" target="_blank" rel="noopener noreferrer">https://mizuoni.blogspot.com/p/union-arena-tier-list.html</a>）
  </footer>

    const tierBoard = document.getElementById('tier-board');
    const modeStarInput = document.getElementById('mode-star');
    const modeHeartInput = document.getElementById('mode-heart');
    const labelModeStar = document.getElementById('label-mode-star');
    const labelModeHeart = document.getElementById('label-mode-heart');

    function syncModeUI() {
      labelModeStar.classList.toggle('active-star', modeStarInput.checked);
      labelModeHeart.classList.toggle('active-heart', modeHeartInput.checked);
    }

    modeStarInput.addEventListener('change', () => {
      if (modeStarInput.checked) {
        modeHeartInput.checked = false;
      }
      syncModeUI();
    });

    modeHeartInput.addEventListener('change', () => {
      if (modeHeartInput.checked) {
        modeStarInput.checked = false;
      }
      syncModeUI();
    });

    function updateCounts() {
      const cards = tierBoard.querySelectorAll('.icon-card');
      const activeCards = tierBoard.querySelectorAll('.icon-card.active');
      document.getElementById('total-count').textContent = cards.length;
      document.getElementById('selected-count').textContent = activeCards.length;

      tierBoard.querySelectorAll('.tier-row').forEach(row => {
        const rowCards = row.querySelectorAll('.icon-card');
        const hint = row.querySelector('.empty-row-hint');
        if (hint) {
          hint.style.display = rowCards.length === 0 ? 'flex' : 'none';
        }
      });
    }

    function handleCardClick(card) {
      if (modeStarInput.checked) {
        const willAddStar = !card.classList.toggle('has-star');
        if (!willAddStar) {
          card.classList.add('active');
        }
        updateCounts();
        return;
      }

      if (modeHeartInput.checked) {
        const willAddHeart = !card.classList.toggle('has-heart');
        if (!willAddHeart) {
          card.classList.add('active');
        }
        updateCounts();
        return;
      }

      card.classList.toggle('active');
      updateCounts();
    }

    function initBoard() {
      TIER_DATA.forEach(({ label, folder, color, files }) => {
        const row = document.createElement('div');
        row.className = 'tier-row';
        row.dataset.tier = label;

        const sidebar = document.createElement('div');
        sidebar.className = 'tier-sidebar';
        sidebar.style.backgroundColor = color;

        const title = document.createElement('div');
        title.className = 'tier-title';
        title.textContent = label;
        sidebar.appendChild(title);

        const grid = document.createElement('div');
        grid.className = 'tier-grid';
        grid.id = `grid-${folder}`;

        const hint = document.createElement('div');
        hint.className = 'empty-row-hint';
        hint.textContent = `尚無 ${label} 圖片`;
        grid.appendChild(hint);

        files.forEach(fileName => {
          const card = document.createElement('div');
          card.className = 'icon-card';
          card.title = `${label} - ${fileName}`;

          const img = document.createElement('img');
          img.src = `images/${folder}/${fileName}`;
          img.alt = fileName;
          img.crossOrigin = 'anonymous';

          const starMark = document.createElement('span');
          starMark.className = 'card-mark mark-star';
          starMark.textContent = '★';

          const heartMark = document.createElement('span');
          heartMark.className = 'card-mark mark-heart';
          heartMark.textContent = '♥';

          card.appendChild(img);
          card.appendChild(starMark);
          card.appendChild(heartMark);
          card.addEventListener('click', () => handleCardClick(card));

          grid.appendChild(card);
        });

        row.appendChild(sidebar);
        row.appendChild(grid);
        tierBoard.appendChild(row);
      });

      updateCounts();
    }

    function selectAll(isActive) {
      tierBoard.querySelectorAll('.icon-card').forEach(card => {
        card.classList.toggle('active', isActive);
      });
      updateCounts();
    }

    function clearAllMarks() {
      tierBoard.querySelectorAll('.icon-card').forEach(card => {
        card.classList.remove('has-star', 'has-heart');
      });
    }

    function isIOSDevice() {
      return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    }

    function canvasToBlob(canvas, type = 'image/png') {
      return new Promise((resolve) => {
        canvas.toBlob((blob) => resolve(blob), type);
      });
    }

    async function saveImageOnIOS(blob, fileName) {
      const file = new File([blob], fileName, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({
            files: [file],
            title: fileName
          });
          return;
        } catch (err) {
          if (err && err.name === 'AbortError') return;
        }
      }

      const blobUrl = URL.createObjectURL(blob);
      const previewWin = window.open(blobUrl, '_blank');
      if (!previewWin) {
        alert('請允許彈出視窗，或改用系統分享儲存圖片。');
      }
      setTimeout(() => URL.revokeObjectURL(blobUrl), 60000);
    }

    async function exportAsImage() {
      const activeCards = tierBoard.querySelectorAll('.icon-card.active');
      if (activeCards.length === 0) {
        alert('目前沒有已點選的 ICON，請先點選至少一張圖片再匯出！');
        return;
      }

      const rows = tierBoard.querySelectorAll('.tier-row');
      rows.forEach(row => {
        const hasActive = row.querySelectorAll('.icon-card.active').length > 0;
        row.classList.toggle('no-active-export', !hasActive);
      });

      tierBoard.classList.add('exporting');
      try {
        const canvas = await html2canvas(tierBoard, {
          scale: 2,
          backgroundColor: null,
          useCORS: true
        });

        const fileName = `Hifumi_TierList_已選取結果.png`;
        const blob = await canvasToBlob(canvas, 'image/png');

        if (!blob) {
          alert('圖片產生失敗，請稍後再試。');
          return;
        }

        if (isIOSDevice()) {
          await saveImageOnIOS(blob, fileName);
          return;
        }

        const blobUrl = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.download = fileName;
        link.href = blobUrl;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(blobUrl), 10000);
      } finally {
        tierBoard.classList.remove('exporting');
        rows.forEach(row => row.classList.remove('no-active-export'));
      }
    }

    initBoard();
  </script>
